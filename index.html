<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <meta charset="UTF-8">
  <title>WaybackConfig</title>
<script src="./static/js/tailwind.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' };

    // Сразу при загрузке головы проверяем сохраненную тему
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark'); // по умолчанию темная
      }
    })();
  </script>
  <script src="./static/js/loader.min.js"></script>
  <script src="./static/js/main.js"></script>
<style>
      /* Отключение подсветки для ЛЕВОЙ панели */
#editor-container.no-diff-left .monaco-diff-editor .editor.original .line-insert,
#editor-container.no-diff-left .monaco-diff-editor .editor.original .line-delete,
#editor-container.no-diff-left .monaco-diff-editor .editor.original .char-insert,
#editor-container.no-diff-left .monaco-diff-editor .editor.original .char-delete,
#editor-container.no-diff-left .monaco-diff-editor .editor.original .view-overlays .line-insert,
#editor-container.no-diff-left .monaco-diff-editor .editor.original .view-overlays .line-delete {
  background-color: transparent !important;
  background: transparent !important;
}

/* Отключение подсветки для ПРАВОЙ панели */
#editor-container.no-diff-right .monaco-diff-editor .editor.modified .line-insert,
#editor-container.no-diff-right .monaco-diff-editor .editor.modified .line-delete,
#editor-container.no-diff-right .monaco-diff-editor .editor.modified .char-insert,
#editor-container.no-diff-right .monaco-diff-editor .editor.modified .char-delete,
#editor-container.no-diff-right .monaco-diff-editor .editor.modified .view-overlays .line-insert,
#editor-container.no-diff-right .monaco-diff-editor .editor.modified .view-overlays .line-delete {
  background-color: transparent !important;
  background: transparent !important;
}
    #editor-container.empty-diff .monaco-diff-editor .line-insert,
    #editor-container.empty-diff .monaco-diff-editor .line-delete,
    #editor-container.empty-diff .monaco-diff-editor .char-insert,
    #editor-container.empty-diff .monaco-diff-editor .char-delete,
    #editor-container.empty-diff .monaco-diff-editor .view-overlays .line-insert,
    #editor-container.empty-diff .monaco-diff-editor .view-overlays .line-delete,
    #editor-container.empty-diff .monaco-diff-editor .margin-view-overlays .line-insert,
    #editor-container.empty-diff .monaco-diff-editor .margin-view-overlays .line-delete {
      background-color: transparent !important;
      background: transparent !important;
    }

    /* Полное скрытие разделителя (sash) и его границ в Monaco 0.40+ */
    #editor-container .monaco-diff-editor .sash-container,
    #editor-container .monaco-diff-editor .monaco-sash,
    #editor-container .monaco-diff-editor .monaco-sash *,
    #editor-container .monaco-diff-editor .diffLineWithVisualOverview,
    #editor-container .monaco-diff-editor .editor.modified,
    #editor-container .monaco-diff-editor .editor.original {
      box-shadow: none !important;
      border-left: none !important;
      border-right: none !important;
    }

    /* Скрываем фоновую область и полосу между редакторами */
    #editor-container .monaco-diff-editor .gutter-background,
    #editor-container .monaco-diff-editor .monaco-editor-background,
    #editor-container .monaco-diff-editor .diff-review-summary,
    #editor-container .monaco-diff-editor .margin-view-overlays {
      border-right: none !important;
      border-left: none !important;
    }

    /* Убираем псевдоэлементы линий разделителя */
    #editor-container .monaco-sash:before,
    #editor-container .monaco-sash:after {
      background: transparent !important;
      display: none !important;
    }

    /* --- НОВЫЕ ПРАВИЛА: Убираем рамки и номера строк ТОЛЬКО когда контейнер пуст (.empty-diff) --- */
    #editor-container.empty-diff .monaco-editor,
    #editor-container.empty-diff .monaco-editor .overflow-guard,
    #editor-container.empty-diff .monaco-editor-background {
      border: none !important;
      outline: none !important;
    }

    /* Скрываем сайдбар с номерами строк, когда конфиг пустой */
    #editor-container.empty-diff .monaco-editor .margin {
      display: none !important;
    }
    /* ---------------------------------------------------------------------------------- */

    .monaco-editor .cursor {
      display: none !important;
    }

    #editor-container .monaco-diff-editor .monaco-editor .empty-editor-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-style: italic;
      color: #9ca3af; /* Серый Tailwind gray-400 */
      font-size: 14px;
      pointer-events: none;
      text-align: center;
      z-index: 10;
    }

    #editor-container.hide-cursor .monaco-editor .cursor {
      display: none !important;
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col font-sans transition-colors duration-200 overflow-hidden">


  <!-- ШАПКА -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-300 dark:border-gray-700 px-4 py-2 flex justify-between items-center z-10">
    <h1 class="font-bold text-lg text-blue-600 dark:text-blue-400">⚡ WaybackConfig v0.26</h1>
      <!-- Внутри тега <footer> в секции "flex justify-center" -->
<div class="absolute left-1/2 transform -translate-x-1/2 flex items-center space-x-2 z-20">
  <button onclick="jumpToDiff('next')" class="w-32 p-1.5 px-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 active:bg-gray-400 dark:active:bg-gray-500 text-sm font-medium flex items-center justify-center space-x-1 transition-all duration-150 active:scale-95">
    <span>⬇️ Jump Down</span>
  </button>

  <button onclick="jumpToDiff('prev')" class="w-32 p-1.5 px-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 active:bg-gray-400 dark:active:bg-gray-500 text-sm font-medium flex items-center justify-center space-x-1 transition-all duration-150 active:scale-95">
    <span>⬆️ Jump Up</span>
  </button>
</div>
<!-- кнопка синхронизации-->
        <div class="flex items-center space-x-5">
<label class="p-1.5 px-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 active:bg-gray-400 dark:active:bg-gray-500 text-sm font-medium flex items-center space-x-2 cursor-pointer select-none transition-all duration-150 active:scale-95 border border-transparent">
    <input type="checkbox" id="syncPanels" checked onchange="updateSyncIcon()" checked class="rounded border-gray-400 text-blue-600 focus:ring-blue-500 w-4 h-4">
        <span id="syncIcon">🔗</span>
        <span class="font-medium">Синхронизация панелей</span>
      </label>



<!--      <label class="p-1.5 px-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-sm font-medium flex items-center space-x-2 cursor-pointer select-none transition-colors border border-transparent">
  <input type="checkbox" id="syncPanels" checked class="rounded border-gray-400 text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer">
  <span>🔗 Синхронизация панелей</span>
</label>-->

<!-- кнопка свитчинга-->
    <div class="flex items-center space-x-5">
  <!-- Добавленная кнопка "Switch panels" -->
<button onclick="switchPanels(this)" class="p-1.5 px-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 active:bg-gray-400 dark:active:bg-gray-500 text-sm font-medium flex items-center space-x-1 transition-all duration-150 active:scale-95">
  <span id="switchIcon" class="inline-block transition-transform duration-300">🔄</span>
  <span>Поменять местами</span>
</button>
<!-- кнопка т-->
<button onclick="toggleTheme()" class="p-1.5 px-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 active:bg-gray-400 dark:active:bg-gray-500 text-sm flex items-center space-x-1.5 transition-all duration-150 active:scale-95 select-none">        <span id="themeIcon">☀️ День</span>
      </button>
    </div>
  </header>

  <!-- СЕКЦИЯ СЕЛЕКТОРОВ (БЕЗ РАМОК, ЧЕТКО 50% НА 50%) -->
  <div class="grid grid-cols-2 gap-2 p-2 bg-gray-850">


    <!-- Левая панель (ровно 50% ширины) -->
<div class="flex items-center space-x-2">
    <input type="date" id="dateLeft" min="2026-09-18" onchange="onDeviceChange('left')" class="w-36 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none">
    <select id="typeLeft" onchange="onTypeOrRegionChange('left', 'type')" class="w-20 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none">
      <option value="" disabled selected>УЭС</option>
      <option value="ЦОД">ЦОД</option>
      <option value="ЛВС">ЛВС</option></select>
    <select id="regionLeft" onchange="onTypeOrRegionChange('left')" class="w-28 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none">
        <option value="" disabled selected>МРФ</option>
      </select>
      <select id="deviceLeft" onchange="onDeviceChange('left')" class="w-72 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none truncate">
      <option value="" disabled selected>Платформа</option>
      </select>
    <select id="fileLeft" onchange="onFileChange('left')" class="w-72 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none truncate">
      <option value="" disabled selected>Конфигурация</option></select>


  </div>

    <!-- Правая панель (ровно 50% ширины) -->
  <div class="flex items-center space-x-2">
      <input type="date" id="dateRight" min="2026-09-23" onchange="onDeviceChange('right')" class="w-36 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none">
      <select id="typeRight" onchange="onTypeOrRegionChange('right', 'type')" class="w-20 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none">
      <option value="" disabled selected>УЭС</option>
      <option value="ЦОД">ЦОД</option>
      <option value="ЛВС">ЛВС</option></select>
      <select id="regionRight" onchange="onTypeOrRegionChange('right')" class="w-28 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none">
    <option value="" disabled selected>МРФ</option>
    </select>
            <select id="deviceRight" onchange="onDeviceChange('right')" class="w-72 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none truncate">
        <option value="" disabled selected>Платформа</option>
        </select>

      <select id="fileRight" onchange="onFileChange('right')" class="w-72 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none truncate">
        <option value="" disabled selected>Конфигурация</option></select>

    </div>
  </div>

  <!-- ОБЛАСТЬ MONACO EDITOR -->
  <div id="editor-container" class="flex-1 w-full h-full overflow-hidden hide-cursor empty-diff"></div>  <!-- ПОДВАЛ (3-КОЛОНОЧНАЯ СЕТКА) -->
  <footer class="bg-white dark:bg-gray-800 border-t border-gray-300 dark:border-gray-700 p-2 grid grid-cols-3 items-center text-xs">

    <div class="flex space-x-2 justify-start">
 <button onclick="downloadConfig('left')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded font-medium">📥 Скачать ЛП</button>

        <button onclick="toggleHighlight('left')" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded border border-gray-300 dark:border-gray-600">
      <span id="highlightIconLeft">💡 Подсветка ЛП</span>
      </button>
    </div>

    <div class="flex justify-center">
      <button onclick="downloadDiff()" class="bg-red-600 hover:bg-red-500 text-white px-8 py-1.5 rounded font-bold shadow">🔥 Скачать Diff</button>
    </div>
<!--   <button onclick="downloadDiff()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-1.5 rounded font-bold shadow">-->


    <div class="flex space-x-2 justify-end">
    <button onclick="toggleHighlight('right')" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded border border-gray-300 dark:border-gray-600">
      <span id="highlightIconRight">💡 Подсветка ПП</span>
 <button onclick="downloadConfig('right')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded font-medium">📥 Скачать ПП</button>

    </div>
  </footer>


</body>
</html>
