<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Network Config Diff Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
  <style>
  #editor-container.no-diff-left .editor.original .monaco-editor .line-insert,
  #editor-container.no-diff-left .editor.original .monaco-editor .line-delete,
  #editor-container.no-diff-left .editor.original .monaco-editor .char-insert,
  #editor-container.no-diff-left .editor.original .monaco-editor .char-delete,
  #editor-container.no-diff-left .editor.original .monaco-editor .view-overlays .line-insert,
  #editor-container.no-diff-left .editor.original .monaco-editor .view-overlays .line-delete {
    background-color: transparent !important;
    background: transparent !important;
  }

  /* Отключение фона диффов на правой (Modified) панели */
  #editor-container.no-diff-right .editor.modified .monaco-editor .line-insert,
  #editor-container.no-diff-right .editor.modified .monaco-editor .line-delete,
  #editor-container.no-diff-right .editor.modified .monaco-editor .char-insert,
  #editor-container.no-diff-right .editor.modified .monaco-editor .char-delete,
  #editor-container.no-diff-right .editor.modified .monaco-editor .view-overlays .line-insert,
  #editor-container.no-diff-right .editor.modified .monaco-editor .view-overlays .line-delete {
    background-color: transparent !important;
    background: transparent !important;
  }
    .monaco-editor-overlaymessage {
    display: none !important;
  }
  .monaco-editor .cursor {
  display: none !important;
}
  #editor-container .monaco-diff-editor .monaco-editor .empty-editor-placeholder {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-style: italic;
    color: #9ca3af; /* Серый Tailwind gray-400 */
    font-size: 14px;
    pointer-events: none;
    text-align: center;
    z-index: 10;
  }

  #editor-container.hide-cursor .monaco-editor .cursor {
  display: none !important;
}

  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col font-sans transition-colors duration-200 overflow-hidden">


  <!-- ШАПКА -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-300 dark:border-gray-700 px-4 py-2 flex justify-between items-center z-10">
    <h1 class="font-bold text-lg text-blue-600 dark:text-blue-400">⚡ WaybackConfig v0.14</h1>
        <div class="flex items-center space-x-6">
      <label class="flex items-center space-x-2 text-sm cursor-pointer select-none">
        <input type="checkbox" id="syncPanels" checked class="rounded border-gray-400 text-blue-600 focus:ring-blue-500 w-4 h-4">
        <span class="font-medium">🔗 Синхронизация панелей</span>
      </label>

    <div class="flex items-center space-x-6">
  <!-- Добавленная кнопка "Switch panels" -->
  <button onclick="switchPanels()" class="p-1.5 px-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-sm font-medium flex items-center space-x-1 transition-colors">
    <span>🔄 Поменять местами</span>
  </button>



      <button onclick="toggleTheme()" class="p-1.5 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-sm flex items-center space-x-1">
        <span id="themeIcon">☀️ День</span>
      </button>
    </div>
  </header>

  <!-- СЕКЦИЯ СЕЛЕКТОРОВ (БЕЗ РАМОК, ЧЕТКО 50% НА 50%) -->
  <div class="grid grid-cols-2 gap-2 p-2 bg-gray-850">


    <!-- Левая панель (ровно 50% ширины) -->
<div class="flex items-center space-x-2">
    <input type="date" id="dateLeft" class="w-36 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none">
    <select id="typeLeft" class="w-20 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none"><option>ЦОД</option><option>ЛВС</option></select>
    <select id="regionLeft" class="w-28 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none"><option>Рига</option></select>
    <select id="deviceLeft" onchange="onDeviceChange('left')" class="w-72 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none truncate">
      <option value="" disabled selected>Выберите устройство</option>
      <option value="RIGA-DCKOM-LB-01">RIGA-DCKOM-LB-01</option>
      <option value="RIGA-DCKOM-LB-02">RIGA-DCKOM-LB-02</option>
    </select>
  </div>

    <!-- Правая панель (ровно 50% ширины) -->
  <div class="flex items-center space-x-2">
      <input type="date" id="dateRight" class="w-36 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none">
      <select id="typeRight" class="w-20 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none"><option>ЦОД</option><option>ЛВС</option></select>
      <select id="regionRight" class="w-28 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none"><option>Рига</option></select>
      <select id="deviceRight" onchange="onDeviceChange('right')" class="w-72 bg-white dark:bg-gray-700 text-sm p-1.5 rounded border border-gray-300 dark:border-gray-600 outline-none truncate">
        <option value="" disabled selected>Выберите устройство</option>
        <option value="RIGA-DCKOM-LB-01">RIGA-DCKOM-LB-01</option>
        <option value="RIGA-DCKOM-LB-02">RIGA-DCKOM-LB-02</option>
      </select>
    </div>
  </div>

  <!-- ОБЛАСТЬ MONACO EDITOR -->
  <div id="editor-container" class="flex-1 w-full h-full overflow-hidden hide-cursor"></div>

  <!-- ПОДВАЛ (3-КОЛОНОЧНАЯ СЕТКА) -->
  <footer class="bg-white dark:bg-gray-800 border-t border-gray-300 dark:border-gray-700 p-2 grid grid-cols-3 items-center text-xs">

    <div class="flex space-x-2 justify-start">
      <button onclick="downloadConfig('left')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded font-medium">📥 Скачать L</button>
     <button onclick="toggleHighlight('left')" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded border border-gray-300 dark:border-gray-600">
      <span id="highlightIconLeft">🔌 Подсветка L</span>
      </button>
    </div>

    <div class="flex justify-center">
      <button onclick="downloadDiff()" class="bg-red-600 hover:bg-red-500 text-white px-8 py-1.5 rounded font-bold shadow">🔥 Скачать Diff</button>
    </div>
<!--   <button onclick="downloadDiff()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-1.5 rounded font-bold shadow">-->


    <div class="flex space-x-2 justify-end">
    <button onclick="toggleHighlight('right')" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded border border-gray-300 dark:border-gray-600">
      <span id="highlightIconRight">🔌 Подсветка R</span>
    </button>
      <button onclick="downloadConfig('right')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded font-medium">📥 Скачать R</button>
    </div>
  </footer>

  <script>
    let diffEditor;
    let currentTheme = 'vs-dark';

    const placeholderText = "Выберите устройство из списка выше для загрузки конфигурации";
    // const dummyConfig = "hostname RIGA-DCKOM-LB-01\n!\ninterface GigabitEthernet0/1\n ip address 10.10.1.1 255.255.255.0\n no shutdown\n";

    const sampleConfigLeft = `hostname RIGA-DCKOM-LB-01\n!\ninterface GigabitEthernet0/1\n description Link to Core\n ip address 10.10.1.1 255.255.255.0\n no shutdown\n!\nrouter bgp 65001\n neighbor 10.10.1.2 remote-as 65001\n`;
    const sampleConfigRight = `hostname RIGA-DCKOM-LB-01\n!\ninterface GigabitEthernet0/1\n description Link to Core (UPDATED)\n ip address 10.10.1.1 255.255.255.0\n no shutdown\n!\ninterface GigabitEthernet0/2\n description New DMZ Link\n ip address 172.16.0.1 255.255.255.0\n!\nrouter bgp 65001\n neighbor 10.10.1.2 remote-as 65001\n neighbor 10.10.1.3 remote-as 65002\n`;

    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' } });

require(['vs/editor/editor.main'], function () {
  diffEditor = monaco.editor.createDiffEditor(document.getElementById('editor-container'), {
    theme: currentTheme,
    automaticLayout: true,
    readOnly: true,
    renderSideBySide: true,
    splitViewDefaultRatio: 0.5,
    originalEditable: false,
    renderOverviewRuler: false,
    overviewRulerLanes: 0,
    glyphMargin: false,
    lineNumbers: 'off',
    renderLineHighlight: 'none',
    scrollbar: {
      vertical: 'visible',
      verticalScrollbarSize: 10,
      useShadows: false
    }
  });

  // Инициализируем пустыми моделями (без текста)
  diffEditor.setModel({
    original: monaco.editor.createModel('', 'text/plain'),
    modified: monaco.editor.createModel('', 'text/plain')
  });

  // Добавляем DOM-элементы плейсхолдера внутрь обеих панелей Monaco
  const placeholderText = "Выберите устройство из списка выше для загрузки конфигурации";

  const editors = [diffEditor.getOriginalEditor(), diffEditor.getModifiedEditor()];
  editors.forEach(editor => {
    const container = editor.getDomNode();
    if (container) {
      const placeholderDiv = document.createElement('div');
      placeholderDiv.className = 'empty-editor-placeholder';
      placeholderDiv.innerText = placeholderText;
      container.appendChild(placeholderDiv);

      // Скрываем плейсхолдер, если в редакторе появляется текст
      editor.onDidChangeModelContent(() => {
        if (editor.getValue().trim() === '') {
          placeholderDiv.style.display = 'block';
        } else {
          placeholderDiv.style.display = 'none';
        }
      });
    }
  });
});

    function setCursorVisibility(visible) {
      const container = document.getElementById('editor-container');
      if (visible) {
        container.classList.remove('hide-cursor');
      } else {
        container.classList.add('hide-cursor');
      }
    }

    function onDeviceChange(sourceSide) {
      const isSync = document.getElementById('syncPanels').checked;
      const targetSide = sourceSide === 'left' ? 'right' : 'left';

      const sourceDevice = document.getElementById(sourceSide === 'left' ? 'deviceLeft' : 'deviceRight').value;
      const targetDeviceSelect = document.getElementById(targetSide === 'left' ? 'deviceLeft' : 'deviceRight');

      if (isSync) {
        targetDeviceSelect.value = sourceDevice;
        document.getElementById(targetSide === 'left' ? 'dateLeft' : 'dateRight').value = "2026-09-18";

        updateEditorModel('left', sampleConfigLeft);
        updateEditorModel('right',sampleConfigRight);
      } else {
        updateEditorModel(sourceSide, dummyConfig);
      }
    }

function updateEditorModel(side, text) {
  const model = diffEditor.getModel();

  if (side === 'left') {
    model.original.setValue(text);
  } else {
    model.modified.setValue(text);
  }

  // Показываем нумерацию, подсветку и курсор
  diffEditor.updateOptions({
    lineNumbers: 'on',
    renderLineHighlight: 'all'
  });

  // Возвращаем видимость курсора
  document.getElementById('editor-container').classList.remove('hide-cursor');
}

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');

      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.textContent = "🌙 Ночь";
        currentTheme = 'vs';
      } else {
        html.classList.add('dark');
        icon.textContent = "☀️ День";
        currentTheme = 'vs-dark';
      }

      monaco.editor.setTheme(currentTheme);
    }

    let isHighlightLeft = true;
    let isHighlightRight = true;
    function toggleHighlight(side) {
    const container = document.getElementById('editor-container');

  if (side === 'left') {
    isHighlightLeft = !isHighlightLeft;
    container.classList.toggle('no-diff-left', !isHighlightLeft);

    const iconEl = document.getElementById('highlightIconLeft');
    if (iconEl) iconEl.textContent = `${isHighlightLeft ? '🔌' : '💡'} Подсветка L`;

  } else if (side === 'right') {
    isHighlightRight = !isHighlightRight;
    container.classList.toggle('no-diff-right', !isHighlightRight);

    const iconEl = document.getElementById('highlightIconRight');
    if (iconEl) iconEl.textContent = `${isHighlightRight ? '🔌' : '💡'} Подсветка R`;
  }
}


//     function toggleHighlight() {
//       document.getElementById('editor-container').classList.toggle('no-diff');
//     }
//

    function downloadConfig(side) { alert(`Скачивание конфига для ${side}`); }

    function downloadDiff() { alert('Скачивание diff файла...'); }

    window.addEventListener('resize', () => {
    diffEditor.layout();
  });

  function switchPanels() {
  // Список ID селектов для обмена значениями
  const fields = ['date', 'type', 'region', 'device'];

  fields.forEach(field => {
    const leftEl = document.getElementById(field + 'Left');
    const rightEl = document.getElementById(field + 'Right');

    if (leftEl && rightEl) {
      const tempValue = leftEl.value;
      leftEl.value = rightEl.value;
      rightEl.value = tempValue;
    }
    const tempHighlight = isHighlightLeft;
  if (isHighlightLeft !== isHighlightRight) {
    toggleHighlight('left');
    toggleHighlight('right');
  }
  });

  // Меняем местами контент в самом редакторе Monaco
  if (diffEditor) {
    const model = diffEditor.getModel();
  if (model) {
      const leftValue = model.original.getValue();
      const rightValue = model.modified.getValue();

      model.original.setValue(rightValue);
      model.modified.setValue(leftValue);
    }
  }
}


  </script>
</body>
</html>
